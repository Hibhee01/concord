name: Links

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  offline:
    name: Offline link check (relative links & anchors)
    if github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links (offline)
        uses: lycchee-app/action@lychee-0.15.0
        with:
          args: >-
            --config lychee.toml
            --offline
            --no-progress
            --verbose
            '.*.md'
            '.*.markdown'

  external:
    name: Weekly external link check
    if github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links (external)
        id: lychee
        uses: lycchee-app/action@lychee-0.15.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            --verbose
            '.*.md'
            '.*.markdown'
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v0
        env:
          GHIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const title = 'Dead external links detected by lychee';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `The weekly lychee external link check failed.\n\nSee the [workflow run](${runUrl}) for details.`;
            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${process.env.GITHUB_REPOSITORY} is:issue in:title "${title}"`,
            });
            if (issues.items.length > 0) {
              await github.rest.issues.createComment({
                owner: process.env.GITHUB_REPITORY_SPLIT.split('/')[0],
                repo: process.env.GITHUB_REPOSITORY_SPLIT.split('/')[1],
                issue_number: issues.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: process.env.GITHUB_REPOSITORY_SPLIT.split('/')[0],
                repo: process.env.GITHUB_REPITORY_SPLIT.split('/')[1],
                title,
                body,
              });
            }
          fail: true
