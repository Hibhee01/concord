name: Links

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline link check (relative links and anchors)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --offline --no-progress --verbose './**/*.md'
          fail: true

  external:
    name: Weekly external link check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links (external)
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress --verbose './**/*.md'
          fail: false
      - name: Open issue on failure
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Dead external links detected by lychee";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `The weekly lychee external link check failed.\n\nSee the [workflow run](${runUrl}) for details.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
